<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quill — AI Trading Bot on Solana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --gold: #FFD700;
    --gold-dim: #FFD700;
    --gold-faint: rgba(255,215,0,0.12);
    --gold-glow: rgba(255,215,0,0.85);
    --black: #080808;
    --black2: #0c0c0c;
    --black3: #111111;
    --card: #0f0f0f;
    --border: rgba(255,215,0,0.3);
    --text: #f5ecd0;
    --text-dim: #8a7a5a;
    --green: #00FF7F;
    --green-dim: #00cc66;
    --green-glow: rgba(0,255,127,0.7);
    --red: #FF3B3B;
    --red-dim: #cc2222;
    --red-glow: rgba(255,59,59,0.7);
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; tap-highlight-color:transparent; }
  html { scroll-behavior:smooth; }
  body {
    background:var(--black);
    color:var(--text);
    font-family:'Syne',sans-serif;
    overflow-x:hidden;
  }

  body::before {
    content:''; position:fixed; inset:0;
    background:repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.04) 2px, rgba(0,0,0,0.04) 4px);
    pointer-events:none; z-index:1000;
  }

  /* ===== NAV ===== */
  nav {
    position:fixed; top:0; left:0; right:0; z-index:500;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 5%; height:70px;
    background:rgba(10,10,10,0.9);
    backdrop-filter:blur(16px);
    border-bottom:1px solid var(--border);
  }
  .nav-logo {
    font-family:'Bebas Neue',sans-serif; font-size:1.9rem;
    color:var(--gold); text-transform:uppercase; letter-spacing:5px;
    text-shadow:0 0 20px var(--gold-glow), 0 0 50px rgba(255,215,0,0.3);
  }
  .nav-logo span { color:#fff; }
  .nav-links { display:flex; gap:2rem; list-style:none; }
  .nav-links a {
    color:var(--text-dim); font-size:0.75rem; text-decoration:none;
    font-family:'DM Mono',monospace; text-transform:uppercase; letter-spacing:2px;
    transition:color 0.3s; position:relative;
  }
  .nav-links a::after {
    content:''; position:absolute; bottom:-4px; left:0; width:0; height:1px;
    background:var(--gold); transition:width 0.3s;
  }
  .nav-links a:hover { color:var(--gold); }
  .nav-links a:hover::after { width:100%; }
  .nav-cta {
    background:transparent; border:1px solid var(--gold);
    color:var(--gold); padding:8px 20px; border-radius:50px;
    font-family:'DM Mono',monospace; font-size:0.7rem; cursor:pointer;
    text-transform:uppercase; letter-spacing:2px;
    transition:all 0.3s; text-decoration:none;
    box-shadow:0 0 18px rgba(255,215,0,0.2);
  }
  .nav-cta:hover { background:var(--gold); color:#000; box-shadow:0 0 35px var(--gold-glow); }

  /* ===== HERO ===== */
  #home {
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    position:relative; overflow:hidden;
    padding:120px 5% 80px;
  }
  .hero-bg {
    position:absolute; inset:0;
    background:radial-gradient(ellipse 70% 60% at 50% 40%, rgba(255,215,0,0.1) 0%, rgba(255,215,0,0.03) 50%, transparent 70%);
  }
  .hero-grid {
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(255,215,0,0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,215,0,0.07) 1px, transparent 1px);
    background-size:60px 60px;
    mask-image:radial-gradient(ellipse 80% 80% at 50% 50%, black 30%, transparent 80%);
  }
  .hero-content {
    position:relative; z-index:2;
    display:grid; grid-template-columns:1fr 1fr; gap:3rem; align-items:center;
    max-width:1200px; width:100%; margin:0 auto;
  }
  .hero-text .tag {
    display:inline-block;
    background:var(--gold-faint); border:1px solid var(--border);
    color:var(--gold); font-family:'DM Mono',monospace; font-size:0.7rem;
    padding:6px 16px; border-radius:50px; letter-spacing:3px; text-transform:uppercase;
    margin-bottom:1.5rem;
    animation:fadeUp 0.8s ease both;
  }
  .hero-title {
    font-family:'Bebas Neue',sans-serif;
    font-size:clamp(3.5rem, 7vw, 5.5rem); line-height:1.0;
    color:#fff; margin-bottom:1.5rem;
    animation:fadeUp 0.8s ease 0.15s both;
    letter-spacing:3px;
  }
  .hero-title .gold {
    color:var(--gold);
    text-shadow:0 0 20px var(--gold-glow), 0 0 50px rgba(255,215,0,0.4), 0 0 90px rgba(255,215,0,0.2);
  }
  .hero-sub {
    font-size:1.0rem; line-height:1.75; color:var(--text-dim);
    margin-bottom:2.5rem; max-width:480px;
    animation:fadeUp 0.8s ease 0.3s both;
  }
  .hero-btns { display:flex; gap:1rem; flex-wrap:wrap; animation:fadeUp 0.8s ease 0.45s both; }
  .btn-primary {
    background:var(--gold); color:#0a0a0a; border:none;
    padding:14px 32px; border-radius:50px;
    font-family:'Bebas Neue',sans-serif; font-size:1rem;
    cursor:pointer; letter-spacing:3px; text-transform:uppercase;
    text-decoration:none; display:inline-block;
    box-shadow:0 0 30px rgba(255,215,0,0.5), 0 0 60px rgba(255,215,0,0.2);
    transition:all 0.3s;
  }
  .btn-primary:hover { transform:translateY(-3px); box-shadow:0 8px 40px rgba(255,215,0,0.7); }
  .btn-outline {
    background:transparent; color:var(--gold); border:1px solid var(--gold);
    padding:14px 32px; border-radius:50px;
    font-family:'Bebas Neue',sans-serif; font-size:1rem;
    cursor:pointer; letter-spacing:3px; text-transform:uppercase;
    text-decoration:none; display:inline-block;
    transition:all 0.3s;
    box-shadow:0 0 18px rgba(255,215,0,0.15);
  }
  .btn-outline:hover { background:var(--gold); color:#000; box-shadow:0 0 40px rgba(255,215,0,0.6); }

  .hero-visual-wrap {
    position:relative; display:flex; justify-content:center; align-items:center;
    animation:fadeUp 0.8s ease 0.2s both;
  }
  .hero-quill-svg {
    width:100%; max-width:520px; height:auto; aspect-ratio:1/1;
    position:relative; z-index:2;
    border-radius:24px; object-fit:cover;
    box-shadow:0 0 60px rgba(255,215,0,0.3), 0 0 120px rgba(255,215,0,0.12), 0 30px 80px rgba(0,0,0,0.6);
  }

  .particles { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .particle {
    position:absolute; width:2px; height:2px;
    background:var(--gold); border-radius:50%;
    animation:particleFloat linear infinite; opacity:0;
  }

  .stats-bar {
    position:relative; z-index:2;
    display:flex; gap:3rem; margin-top:2rem;
    animation:fadeUp 0.8s ease 0.6s both;
  }
  .stat { text-align:left; }
  .stat-num {
    font-family:'Bebas Neue',sans-serif; font-size:2.2rem;
    color:var(--gold);
    text-shadow:0 0 20px var(--gold-glow), 0 0 45px rgba(255,215,0,0.3);
    letter-spacing:2px;
  }
  .stat-label { font-size:0.65rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:2px; font-family:'DM Mono',monospace; }

  /* ===== SHARED SECTION STYLES ===== */
  .section-tag {
    display:inline-block;
    background:var(--gold-faint); border:1px solid var(--border);
    color:var(--gold); font-family:'DM Mono',monospace; font-size:0.65rem;
    padding:5px 14px; border-radius:50px; letter-spacing:3px; text-transform:uppercase;
    margin-bottom:1rem;
  }
  .section-title {
    font-family:'Bebas Neue',sans-serif; font-size:clamp(2rem, 4vw, 3.2rem);
    color:#fff; margin-bottom:1.2rem; letter-spacing:3px;
  }
  .section-title .gold {
    color:var(--gold);
    text-shadow:0 0 20px var(--gold-glow), 0 0 50px rgba(255,215,0,0.4);
  }
  .section-desc {
    font-size:0.95rem; line-height:1.8; color:var(--text-dim);
    max-width:600px; margin-bottom:2rem;
  }

  /* ===== BOT PERSONALITIES SECTION ===== */
  #bot {
    padding:100px 5%; position:relative;
    background:var(--black2);
    border-top:1px solid rgba(255,215,0,0.12);
  }
  #bot::before {
    content:''; position:absolute; top:0; left:0; right:0; height:1px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
    box-shadow:0 0 12px rgba(255,215,0,0.4);
  }
  .bot-inner { max-width:1200px; margin:0 auto; }
  .bot-header { text-align:center; margin-bottom:1rem; }
  .bot-fee-note {
    display:inline-flex; align-items:center; gap:8px; margin-top:0.5rem;
    font-family:'DM Mono',monospace; font-size:0.65rem; color:var(--text-dim);
    letter-spacing:1px;
  }
  .bot-fee-dot { width:6px; height:6px; border-radius:50%; background:var(--gold); flex-shrink:0; }

  .bot-pers-grid {
    display:grid; grid-template-columns:repeat(3,1fr); gap:24px;
    margin-top:3rem;
  }
  .bot-pers-card {
    background:var(--card); border-radius:24px; overflow:hidden;
    position:relative; transition:all 0.4s;
  }
  .bot-pers-card.safe     { border:1px solid rgba(100,200,100,0.3); }
  .bot-pers-card.balanced { border:1px solid rgba(255,215,0,0.35); }
  .bot-pers-card.degen    { border:1px solid rgba(220,80,80,0.3); }
  .bot-pers-card.safe:hover     { border-color:#00FF7F; transform:translateY(-8px); box-shadow:0 0 50px rgba(100,200,100,0.2), 0 20px 50px rgba(0,0,0,0.5); }
  .bot-pers-card.balanced:hover { border-color:var(--gold); transform:translateY(-8px); box-shadow:0 0 50px rgba(255,215,0,0.25), 0 20px 50px rgba(0,0,0,0.5); }
  .bot-pers-card.degen:hover    { border-color:#FF3B3B; transform:translateY(-8px); box-shadow:0 0 50px rgba(220,80,80,0.2), 0 20px 50px rgba(0,0,0,0.5); }
  .bot-pers-card::before {
    content:''; position:absolute; top:0; left:0; right:0; height:3px;
  }
  .bot-pers-card.safe::before     { background:linear-gradient(90deg,transparent,#00FF7F,transparent); }
  .bot-pers-card.balanced::before { background:linear-gradient(90deg,transparent,var(--gold),transparent); }
  .bot-pers-card.degen::before    { background:linear-gradient(90deg,transparent,#FF3B3B,transparent); }

  .bot-pers-placeholder {
    width:100%; height:200px; background:var(--black3);
    display:flex; align-items:center; justify-content:center;
    font-size:4rem; color:rgba(255,215,0,0.15);
    border-bottom:1px solid rgba(255,215,0,0.08);
    font-family:'Bebas Neue',sans-serif; letter-spacing:4px;
    position:relative; overflow:hidden;
  }
  .bot-pers-placeholder::after {
    content:''; position:absolute; inset:0;
    background:radial-gradient(ellipse 60% 60% at 50% 60%, rgba(255,215,0,0.08) 0%, transparent 70%);
  }
  .safe .bot-pers-placeholder::after    { background:radial-gradient(ellipse 60% 60% at 50% 60%, rgba(100,200,100,0.1) 0%, transparent 70%); }
  .degen .bot-pers-placeholder::after   { background:radial-gradient(ellipse 60% 60% at 50% 60%, rgba(220,80,80,0.1) 0%, transparent 70%); }

  .bot-pers-body { padding:1.8rem 2rem 2.2rem; }
  .bot-pers-tag {
    display:inline-block; font-family:'DM Mono',monospace; font-size:0.6rem;
    padding:4px 12px; border-radius:50px; letter-spacing:2px; text-transform:uppercase;
    margin-bottom:1rem;
  }
  .safe .bot-pers-tag     { background:rgba(100,200,100,0.1); border:1px solid rgba(100,200,100,0.35); color:#00FF7F; }
  .balanced .bot-pers-tag { background:var(--gold-faint); border:1px solid var(--border); color:var(--gold); }
  .degen .bot-pers-tag    { background:rgba(220,80,80,0.08); border:1px solid rgba(220,80,80,0.3); color:#FF3B3B; }

  .bot-pers-name {
    font-family:'Bebas Neue',sans-serif; font-size:1.8rem; letter-spacing:3px;
    color:#fff; margin-bottom:0.6rem;
  }
  .bot-pers-desc { font-size:0.87rem; color:var(--text-dim); line-height:1.7; margin-bottom:1.5rem; }

  .bot-pers-stats { display:flex; flex-direction:column; gap:10px; }
  .bps-row { display:flex; align-items:center; gap:10px; }
  .bps-label { font-family:'DM Mono',monospace; font-size:0.58rem; color:var(--text-dim); letter-spacing:1px; width:70px; flex-shrink:0; }
  .bps-bar { flex:1; height:5px; border-radius:3px; background:rgba(255,255,255,0.06); overflow:hidden; }
  .bps-fill { height:100%; border-radius:3px; transition:width 1.2s ease; }
  .safe     .bps-fill { background:#00FF7F; box-shadow:0 0 8px rgba(100,200,100,0.5); }
  .balanced .bps-fill { background:var(--gold); box-shadow:0 0 8px rgba(255,215,0,0.5); }
  .degen    .bps-fill { background:#FF3B3B; box-shadow:0 0 8px rgba(220,80,80,0.5); }
  .bps-val { font-family:'DM Mono',monospace; font-size:0.62rem; width:50px; flex-shrink:0; text-align:right; }
  .safe     .bps-val { color:#00FF7F; }
  .balanced .bps-val { color:var(--gold); }
  .degen    .bps-val { color:#FF3B3B; }

  /* ===== FEE SECTION ===== */
  #fee {
    padding:100px 5%; position:relative;
    background:var(--black);
    border-top:1px solid rgba(255,215,0,0.1);
  }
  .fee-inner { max-width:800px; margin:0 auto; text-align:center; }
  .fee-card {
    background:var(--card); border:1px solid var(--border); border-radius:28px;
    padding:3rem 2.5rem; margin-top:2.5rem; position:relative; overflow:hidden;
  }
  .fee-card::before {
    content:''; position:absolute; top:0; left:0; right:0; height:3px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
    box-shadow:0 0 12px rgba(255,215,0,0.4);
  }
  .fee-badge {
    display:inline-flex; align-items:center; gap:10px; margin-bottom:1.5rem;
    font-family:'Bebas Neue',sans-serif; font-size:2.5rem; letter-spacing:4px;
    color:var(--gold);
    text-shadow:0 0 30px rgba(255,215,0,0.5);
  }
  .fee-desc { color:var(--text-dim); line-height:1.8; margin-bottom:2rem; font-size:0.95rem; }
  .fee-points { display:flex; flex-direction:column; gap:14px; text-align:left; }
  .fee-point {
    display:flex; align-items:flex-start; gap:14px;
    background:rgba(255,215,0,0.04); border:1px solid rgba(255,215,0,0.12);
    border-radius:14px; padding:14px 18px;
  }
  .fee-point-dot {
    width:8px; height:8px; border-radius:50%; background:var(--gold);
    flex-shrink:0; margin-top:5px;
    box-shadow:0 0 8px rgba(255,215,0,0.5);
  }
  .fee-point-text { font-family:'DM Mono',monospace; font-size:0.75rem; color:var(--text); line-height:1.6; }
  .fee-point-text strong { color:var(--gold); }

  /* ===== WAITLIST SECTION ===== */
  #waitlist {
    background:var(--black2); position:relative; overflow:hidden;
    padding:100px 5%;
    border-top:1px solid rgba(255,215,0,0.1);
  }
  #waitlist::before {
    content:''; position:absolute; top:0; left:0; right:0; height:1px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
    box-shadow:0 0 12px rgba(255,215,0,0.4);
  }
  #waitlist::after {
    content:''; position:absolute;
    width:600px; height:600px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,215,0,0.04) 0%, transparent 70%);
    top:50%; left:50%; transform:translate(-50%,-50%);
    pointer-events:none;
  }
  .waitlist-inner { max-width:680px; margin:0 auto; text-align:center; position:relative; z-index:2; }
  .waitlist-card {
    background:var(--card); border:1px solid var(--border);
    border-radius:24px; padding:3rem 2.5rem; margin-top:2.5rem;
    position:relative; overflow:hidden;
  }
  .waitlist-card::before {
    content:''; position:absolute; top:0; left:0; right:0; height:3px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
    box-shadow:0 0 12px rgba(255,215,0,0.4);
  }
  .waitlist-perks {
    display:flex; justify-content:center; gap:2rem; flex-wrap:wrap;
    margin:1.5rem 0 2rem;
  }
  .waitlist-perk {
    display:flex; align-items:center; gap:7px;
    font-family:'DM Mono',monospace; font-size:0.65rem;
    color:var(--text-dim); letter-spacing:1px;
  }
  .waitlist-perk .perk-dot { width:6px; height:6px; border-radius:50%; background:var(--gold); box-shadow:0 0 6px rgba(255,215,0,0.5); flex-shrink:0; }
  .newsletter-form-row {
    display:flex; flex-direction:column; gap:10px; max-width:420px; margin:0 auto; width:100%;
  }
  .newsletter-input {
    width:100%; background:var(--black3); border:1px solid var(--border);
    border-radius:50px; padding:14px 22px; color:#fff;
    font-family:'DM Mono',monospace; font-size:0.8rem;
    outline:none; transition:border-color 0.3s, box-shadow 0.3s;
    box-sizing:border-box;
  }
  .newsletter-input:focus { border-color:var(--gold); box-shadow:0 0 16px rgba(255,215,0,0.15); }
  .newsletter-input::placeholder { color:var(--text-dim); }
  .newsletter-btn {
    width:100%; background:var(--gold); color:#000; border:none;
    border-radius:50px; padding:14px 26px;
    font-family:'Bebas Neue',sans-serif; font-size:1rem;
    letter-spacing:3px; text-transform:uppercase; cursor:pointer;
    box-shadow:0 0 20px rgba(255,215,0,0.3);
    transition:all 0.3s;
  }
  .newsletter-btn:hover { transform:translateY(-2px); box-shadow:0 6px 30px rgba(255,215,0,0.5); }
  .newsletter-btn:disabled { opacity:0.6; cursor:not-allowed; transform:none; }
  @media (min-width:540px) {
    .newsletter-form-row { flex-direction:row; }
    .newsletter-input { flex:1; width:auto; }
    .newsletter-btn { width:auto; }
  }
  .newsletter-msg {
    margin-top:1rem; font-family:'DM Mono',monospace; font-size:0.7rem;
    padding:10px 16px; border-radius:50px; display:none;
  }
  .newsletter-msg.success { display:block; color:var(--gold); background:rgba(255,215,0,0.08); border:1px solid rgba(255,215,0,0.25); }
  .newsletter-msg.error   { display:block; color:#ff6464; background:rgba(255,79,79,0.08); border:1px solid rgba(255,79,79,0.2); }

  /* ===== CONTACT ===== */
  #contact {
    padding:100px 5%; background:var(--black);
    border-top:1px solid rgba(255,215,0,0.1);
  }
  .contact-inner { max-width:900px; margin:0 auto; text-align:center; }
  .contact-links { display:flex; flex-wrap:wrap; gap:16px; justify-content:center; margin-top:2.5rem; }
  .contact-link {
    display:flex; flex-direction:column; align-items:center; gap:8px;
    background:var(--card); border:1px solid var(--border);
    border-radius:20px; padding:1.5rem 1.8rem; min-width:140px;
    text-decoration:none; transition:all 0.3s; color:inherit;
  }
  .contact-link:hover { border-color:var(--gold); box-shadow:0 0 30px rgba(255,215,0,0.15); transform:translateY(-4px); }
  .contact-icon { font-size:1.5rem; }
  .contact-name { font-family:'DM Mono',monospace; font-size:0.7rem; color:#fff; letter-spacing:2px; text-transform:uppercase; }
  .contact-url { font-family:'DM Mono',monospace; font-size:0.58rem; color:var(--text-dim); letter-spacing:1px; }

  /* ===== FOOTER ===== */
  footer {
    background:var(--black); border-top:1px solid var(--border);
    padding:3rem 5%; text-align:center;
  }
  .footer-logo {
    font-family:'Bebas Neue',sans-serif; font-size:2rem; letter-spacing:6px;
    color:var(--gold); margin-bottom:1rem;
    text-shadow:0 0 20px rgba(255,215,0,0.3);
  }
  .footer-text { font-family:'DM Mono',monospace; font-size:0.65rem; color:var(--text-dim); letter-spacing:1px; margin-top:0.5rem; }
  .footer-text a { color:var(--text-dim); text-decoration:none; transition:color 0.2s; }
  .footer-text a:hover { color:var(--gold); }
  .creator-strip { margin-top:2rem; display:flex; flex-direction:column; align-items:center; gap:10px; }
  .creator-label { font-family:'DM Mono',monospace; font-size:0.6rem; color:rgba(255,215,0,0.35); letter-spacing:2px; text-transform:uppercase; }
  .creator-card {
    display:flex; align-items:center; gap:1.2rem;
    border:1px solid rgba(255,215,0,0.1); border-radius:50px; padding:10px 20px;
    opacity:0.5; transition:opacity 0.4s, border-color 0.4s;
  }
  .creator-card:hover { opacity:1; border-color:rgba(255,215,0,0.25); }
  .creator-handle {
    display:flex; align-items:center; gap:7px;
    font-family:'DM Mono',monospace; font-size:0.6rem;
    color:var(--text-dim); text-decoration:none; letter-spacing:1px; transition:color 0.3s;
  }
  .creator-handle:hover { color:var(--gold); }
  .creator-dot { width:3px; height:3px; border-radius:50%; background:rgba(255,215,0,0.2); }

  /* ===== PAGE TRANSITION ===== */
  @keyframes pageEnter {
    from { opacity:0; transform:translateY(22px); }
    to   { opacity:1; transform:translateY(0); }
  }
  body { animation: pageEnter 0.7s cubic-bezier(0.22,1,0.36,1) both; }

  /* ===== SCROLL FADE-IN ===== */
  .fie {
    opacity:0;
    transform:translateY(40px);
    transition: opacity 0.8s cubic-bezier(0.22,1,0.36,1),
                transform 0.8s cubic-bezier(0.22,1,0.36,1);
  }
  .fie.in { opacity:1; transform:translateY(0); }

  /* ===== REVEAL ANIMATION ===== */
  .reveal { opacity:0; transform:translateY(30px); transition:opacity 0.7s ease, transform 0.7s ease; }
  .reveal.visible { opacity:1; transform:translateY(0); }

  /* ===== KEYFRAMES ===== */
  @keyframes fadeUp { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:translateY(0); } }
  @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-12px); } }
  @keyframes rotate { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
  @keyframes pulse { 0%,100% { opacity:0.5; transform:scale(1); } 50% { opacity:0.9; transform:scale(1.05); } }
  @keyframes particleFloat {
    0% { opacity:0; transform:translateY(0) translateX(0); }
    10% { opacity:0.8; }
    90% { opacity:0.3; }
    100% { opacity:0; transform:translateY(-200px) translateX(var(--dx,0)); }
  }

  /* ===== HAMBURGER ===== */
  .hamburger {
    display:none; background:transparent; border:none; color:var(--gold);
    font-size:1.3rem; cursor:pointer; padding:8px;
  }

  /* ===== DASH MEMBER BADGE ===== */
  .member-badge {
    display:inline-flex; align-items:center; gap:7px;
    background:var(--gold-faint); border:1px solid var(--border);
    color:var(--gold); font-family:'DM Mono',monospace; font-size:0.6rem;
    padding:4px 14px; border-radius:50px; letter-spacing:3px; text-transform:uppercase;
  }
  .member-dot { width:7px; height:7px; border-radius:50%; background:var(--gold); box-shadow:0 0 8px var(--gold); animation:pulse 1.5s ease-in-out infinite; }
  .nav-user-badge { display:inline-flex; align-items:center; gap:10px; }

  /* OWL/QUILL verified badge in nav */
  .quill-verified-badge {
    display:inline-flex; align-items:center; gap:6px;
    background:linear-gradient(135deg, rgba(255,215,0,0.18), rgba(255,215,0,0.06));
    border:1px solid var(--gold);
    color:var(--gold); font-family:'DM Mono',monospace; font-size:0.6rem; font-weight:500;
    padding:4px 12px; border-radius:50px; letter-spacing:3px;
    text-transform:uppercase;
    box-shadow:0 0 12px rgba(255,215,0,0.3);
    animation:quillBadgePulse 2.5s ease-in-out infinite;
  }
  @keyframes quillBadgePulse {
    0%,100% { box-shadow:0 0 12px rgba(255,215,0,0.3); }
    50%     { box-shadow:0 0 22px rgba(255,215,0,0.6); }
  }

  .nav-avatar-btn {
    width:34px; height:34px; border-radius:50%;
    background:var(--gold-faint); border:1px solid var(--gold);
    display:flex; align-items:center; justify-content:center;
    font-size:1rem; cursor:pointer; transition:all 0.2s;
    box-shadow:0 0 12px rgba(255,215,0,0.2);
  }
  .nav-avatar-btn:hover { box-shadow:0 0 22px rgba(255,215,0,0.5); transform:scale(1.08); }

  /* ===== AUTH MODAL ===== */
  .auth-overlay {
    position:fixed; inset:0; z-index:9000;
    background:rgba(0,0,0,0.9); backdrop-filter:blur(18px);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity 0.3s;
  }

  .auth-modal {

  }

  .auth-close {
    position:absolute; top:16px; right:18px;
    background:transparent; border:none; color:var(--text-dim);
    font-size:1.1rem; cursor:pointer; transition:color 0.2s; line-height:1;
  }
  .auth-close:hover { color:var(--gold); }
  .auth-logo {
    text-align:center; margin-bottom:1.5rem;
    padding-bottom:1.5rem; border-bottom:1px solid rgba(255,215,0,0.12);
  }
  .logo-text {
    font-family:'Bebas Neue',sans-serif; font-size:2rem; letter-spacing:6px;
    color:var(--gold);
    text-shadow:0 0 20px rgba(255,215,0,0.5);
  }
  .auth-tabs { display:flex; gap:4px; margin-bottom:1.5rem; background:rgba(255,215,0,0.06); border-radius:12px; padding:4px; }
  .auth-tab {
    flex:1; background:transparent; border:none; color:var(--text-dim);
    font-family:'DM Mono',monospace; font-size:0.7rem; letter-spacing:1.5px;

  }
  .auth-tab.active { background:var(--gold); color:#000; font-weight:500; }
  .auth-form.hidden { display:none; }
  .auth-field { margin-bottom:1rem; }
  .auth-field label { display:block; font-family:'DM Mono',monospace; font-size:0.6rem; color:var(--text-dim); letter-spacing:2px; text-transform:uppercase; margin-bottom:6px; }
  .auth-field input {
    width:100%; background:var(--black3); border:1px solid var(--border);
    border-radius:10px; padding:12px 16px; color:#fff;
    font-family:'DM Mono',monospace; font-size:0.85rem;
    outline:none; transition:border-color 0.3s, box-shadow 0.3s;
  }
  .auth-field input:focus { border-color:var(--gold); box-shadow:0 0 16px rgba(255,215,0,0.12); }
  .auth-field input::placeholder { color:rgba(255,215,0,0.25); }
  .auth-forgot { text-align:right; margin-bottom:1.2rem; }
  .auth-forgot button { background:transparent; border:none; color:var(--text-dim); font-family:'DM Mono',monospace; font-size:0.65rem; cursor:pointer; transition:color 0.2s; letter-spacing:1px; }
  .auth-forgot button:hover { color:var(--gold); }
  .auth-submit {
    width:100%; background:var(--gold); color:#000; border:none;
    border-radius:50px; padding:13px;
    font-family:'Bebas Neue',sans-serif; font-size:1rem;
    letter-spacing:3px; text-transform:uppercase; cursor:pointer;
    box-shadow:0 0 24px rgba(255,215,0,0.35);
    transition:all 0.3s; margin-top:0.5rem;
  }
  .auth-submit:hover { transform:translateY(-2px); box-shadow:0 6px 30px rgba(255,215,0,0.5); }
  .auth-submit:disabled { opacity:0.6; cursor:not-allowed; transform:none; }
  .auth-msg {
    padding:10px 14px; border-radius:10px; font-family:'DM Mono',monospace; font-size:0.68rem;
    text-align:center; line-height:1.5; margin-bottom:1rem; display:none;
  }
  .auth-msg.success { display:block; color:var(--gold); background:rgba(255,215,0,0.08); border:1px solid rgba(255,215,0,0.25); }
  .auth-msg.error   { display:block; color:#ff6464; background:rgba(255,79,79,0.08); border:1px solid rgba(255,79,79,0.25); }
  .auth-hint {
    margin-top:1rem; padding:12px 14px; border-radius:12px;
    background:rgba(255,215,0,0.06); border:1px solid rgba(255,215,0,0.18);
    font-family:'DM Mono',monospace; font-size:0.65rem; color:var(--text-dim); line-height:1.6;
    display:none;
  }
  .auth-hint.show { display:block; }
  .auth-hint span { color:var(--gold); }
  .auth-divider {
    text-align:center; margin:1rem 0; font-family:'DM Mono',monospace;
    font-size:0.6rem; color:var(--text-dim); letter-spacing:2px;
    position:relative;
  }
  .auth-divider::before, .auth-divider::after {
    content:''; position:absolute; top:50%; width:40%; height:1px;
    background:rgba(255,215,0,0.15);
  }
  .auth-divider::before { left:0; }
  .auth-divider::after { right:0; }
  .auth-wallet-intro { text-align:center; margin-bottom:1.5rem; }
  .auth-wallet-icon { font-size:2rem; color:var(--gold); margin-bottom:0.5rem; }
  .auth-wallet-title { font-family:'Bebas Neue',sans-serif; font-size:1.3rem; letter-spacing:3px; color:#fff; margin-bottom:0.3rem; }
  .auth-wallet-sub { font-family:'DM Mono',monospace; font-size:0.65rem; color:var(--text-dim); letter-spacing:1px; }
  .auth-wallet-options { display:flex; flex-direction:column; gap:10px; margin-bottom:1rem; }
  .auth-wallet-option {
    display:flex; align-items:center; gap:14px;
    background:var(--black3); border:1px solid var(--border);
    border-radius:14px; padding:14px 16px; cursor:pointer; transition:all 0.25s;
  }
  .auth-wallet-option:hover { border-color:var(--gold); background:var(--gold-faint); transform:translateX(4px); }
  .auth-wallet-opt-icon {
    width:40px; height:40px; border-radius:10px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:var(--gold-faint); border:1px solid var(--border);
    font-family:'DM Mono',monospace; font-size:0.6rem; font-weight:500;

  .wallet-msg.success { display:block; color:var(--gold); background:rgba(255,215,0,0.08); border:1px solid rgba(255,215,0,0.2); }
  .wallet-msg.error   { display:block; color:#ff6464; background:rgba(255,79,79,0.08); border:1px solid rgba(255,79,79,0.2); }

  /* Wallet OWL pill */

    display:inline-flex; align-items:center; gap:5px;
    background:var(--gold-faint); border:1px solid var(--gold);

  }

  /* Settings */
  .dash-name-label { font-family:'DM Mono',monospace; font-size:0.58rem; color:var(--text-dim); letter-spacing:3px; text-transform:uppercase; margin-bottom:10px; }

  .profile-name-input {

  /* Bot section in dash */
  .dash-bot-img-wrap {
    width:100%; aspect-ratio:16/9; border-radius:12px; overflow:hidden;
    position:relative; margin-bottom:16px;
    background:var(--black2); border:1px solid rgba(255,215,0,0.15);
  }
  .dash-bot-img-wrap img { width:100%; height:100%; object-fit:cover; display:block; }
  .scan-grid {
    position:absolute; inset:0;
    background-image:linear-gradient(rgba(255,215,0,0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(255,215,0,0.06) 1px, transparent 1px);
    background-size:20px 20px; pointer-events:none;
  }
  .scan-line { position:absolute; left:0; right:0; height:2px; background:rgba(255,215,0,0.6); box-shadow:0 0 10px rgba(255,215,0,0.8); top:50%; opacity:0; }
  .scan-vignette { position:absolute; inset:0; background:radial-gradient(ellipse 80% 80% at 50% 50%, transparent 40%, rgba(0,0,0,0.5) 100%); }
  .scan-trail { position:absolute; left:0; right:0; height:40px; background:linear-gradient(rgba(255,215,0,0.08), transparent); top:50%; opacity:0; }
  .scan-status {
    position:absolute; bottom:8px; right:10px;
    font-family:'DM Mono',monospace; font-size:0.55rem; letter-spacing:2px;
    color:rgba(255,215,0,0.5); background:rgba(0,0,0,0.6); padding:3px 8px; border-radius:4px;

  .scanner-active .scan-line { animation:scanMove 2s linear infinite; opacity:1; }
  .scanner-active .scan-trail { animation:trailMove 2s linear infinite; opacity:1; }
  @keyframes scanMove { 0%,100% { top:0; } 50% { top:100%; } }
  @keyframes trailMove { 0%,100% { top:0; } 50% { top:100%; } }

  .dash-personality-label {
    font-family:'DM Mono',monospace; font-size:0.58rem; color:var(--text-dim);
    letter-spacing:3px; text-transform:uppercase; margin-bottom:10px;
  }
  .dash-personality-row { display:flex; gap:8px; margin-bottom:14px; }
  .dash-persona-btn {
    flex:1; background:var(--black2); border:1px solid rgba(255,215,0,0.15);
    border-radius:10px; padding:10px 6px; cursor:pointer; text-align:center; transition:all 0.2s;
  }
  .dash-persona-btn.active { border-color:var(--gold); background:var(--gold-faint); }
  .dash-persona-btn:hover { border-color:rgba(255,215,0,0.4); }
  .dash-persona-name { font-family:'DM Mono',monospace; font-size:0.62rem; color:#fff; letter-spacing:1px; text-transform:uppercase; margin-bottom:2px; }
  .dash-persona-sub  { font-family:'DM Mono',monospace; font-size:0.5rem; color:var(--text-dim); letter-spacing:1px; text-transform:uppercase; }
  .dash-persona-btn.guardian   .dash-persona-sub { color:#00FF7F; }
  .dash-persona-btn.strategist .dash-persona-sub { color:var(--gold); }
  .dash-persona-btn.predator   .dash-persona-sub { color:#FF3B3B; }

  .bot-tab-panel { font-family:'DM Mono',monospace; }
  .bot-tab-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .bot-tab-title { font-family:'Bebas Neue',sans-serif; font-size:1.1rem; letter-spacing:3px; color:#fff; }
  .bot-status-badge {
    display:inline-flex; align-items:center; gap:6px;
    font-family:'DM Mono',monospace; font-size:0.55rem; letter-spacing:2px;
    padding:4px 10px; border-radius:50px;
  }
  .bot-status-badge.active   { background:rgba(100,200,100,0.1); border:1px solid rgba(100,200,100,0.3); color:#00FF7F; }
  .bot-status-badge.inactive { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); color:rgba(255,255,255,0.3); }
  .bot-sdot { width:6px; height:6px; border-radius:50%; background:currentColor; animation:pulse 1.5s ease-in-out infinite; }
  .bot-tab-header.active-guardian   .bot-tab-title { color:#00FF7F; }
  .bot-tab-header.active-strategist .bot-tab-title { color:var(--gold); }
  .bot-tab-header.active-predator   .bot-tab-title { color:#FF3B3B; }
  .bot-tab-note { font-family:'DM Mono',monospace; font-size:0.62rem; letter-spacing:1px; padding:10px 14px; border-radius:10px; margin-bottom:12px; text-align:center; }
  .inactive-note { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06); color:rgba(255,255,255,0.25); }
  .dash-stats-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .dash-stat-box {
    background:var(--black2); border:1px solid rgba(255,215,0,0.12);
    border-radius:10px; padding:10px 12px;
  }
  .inactive-stat { border-color:rgba(255,255,255,0.04); }
  .dash-stat-label { font-family:'DM Mono',monospace; font-size:0.52rem; color:var(--text-dim); letter-spacing:2px; text-transform:uppercase; margin-bottom:4px; }
  .dash-stat-value { font-family:'DM Mono',monospace; font-size:0.85rem; color:var(--gold); font-weight:500; }

  /* ── TIER BADGE (profile) ── */
  .tier-badge-wrap {
    display:flex; justify-content:center; margin:10px 0 4px;
  }
  .tier-badge {
    display:inline-flex; align-items:center; gap:7px;
    padding:6px 16px; border-radius:50px;
    font-family:'DM Mono',monospace; font-size:0.65rem; letter-spacing:3px;
    text-transform:uppercase; font-weight:500;
    border:1px solid; transition:box-shadow 0.3s;
  }
  .tier-badge-gem { font-size:0.85rem; }
  .tier-badge.iron {
    background:rgba(120,120,130,0.14); border-color:rgba(150,150,160,0.4);
    color:#9a9aa3; box-shadow:0 0 10px rgba(140,140,150,0.12);
  }
  .tier-badge.bronze {
    background:rgba(140,80,30,0.18); border-color:rgba(180,110,50,0.55);
    color:#c8845a; box-shadow:0 0 12px rgba(180,100,40,0.2);
  }
  .tier-badge.silver {
    background:rgba(160,160,170,0.12); border-color:rgba(180,180,190,0.5);
    color:#c0c0cc; box-shadow:0 0 12px rgba(180,180,200,0.15);
  }
  .tier-badge.gold {
    background:rgba(255,215,0,0.1); border-color:rgba(255,215,0,0.45);
    color:var(--gold); box-shadow:0 0 14px rgba(255,215,0,0.2);
  }
  .tier-badge.platinum {
    background:rgba(100,160,220,0.1); border-color:rgba(130,180,230,0.5);
    color:#9ec8e8; box-shadow:0 0 14px rgba(100,180,240,0.18);
  }
  .tier-badge.diamond {
    background:rgba(80,220,220,0.1); border-color:rgba(80,230,230,0.5);
    color:#5ce8e8; box-shadow:0 0 16px rgba(60,220,220,0.25);
  }

  /* Announcements skeleton */
  .dash-announce-list { display:flex; flex-direction:column; gap:10px; }

  /* Notification / announcement items */
  .notif-item {
    padding:10px 0; border-bottom:1px solid rgba(255,215,0,0.06); display:flex; flex-direction:column; gap:5px;
  }
  .notif-item:last-child { border-bottom:none; }
  .notif-message { font-family:'DM Mono',monospace; font-size:0.7rem; color:var(--text); line-height:1.6; }
  .notif-time { font-family:'DM Mono',monospace; font-size:0.52rem; color:var(--text-dim); letter-spacing:0.5px; }
  .notif-action-btn {
    align-self:flex-start; margin-top:4px; background:rgba(255,215,0,0.1); border:1px solid rgba(255,215,0,0.35);
    color:var(--gold); font-family:'DM Mono',monospace; font-size:0.58rem; letter-spacing:1.5px;
    text-transform:uppercase; padding:6px 12px; border-radius:8px; cursor:pointer; text-decoration:none;

  .notif-action-btn:hover { background:rgba(255,215,0,0.18); }

  /* Nav unread badge */

    position:absolute; top:-4px; right:-4px; min-width:16px; height:16px;
    background:var(--red); border-radius:50px; display:flex; align-items:center; justify-content:center;
    font-family:'DM Mono',monospace; font-size:0.48rem; font-weight:500; color:#fff;
    padding:0 4px; pointer-events:none; z-index:10;
  }
  .dash-ann-item {
    padding:14px; border-radius:12px; border:1px solid rgba(255,215,0,0.08);
    display:flex; flex-direction:column; gap:7px; background:rgba(0,0,0,0.12);
  }
  .dash-ann-item { background:rgba(255,215,0,0.03); border-radius:10px; padding:12px; }
  @keyframes dashShimmer {
    0%,100% { opacity:0.4; } 50% { opacity:0.8; }
  }

  /* Sign out */
  .profile-signout-btn {
    width:100%; background:transparent; border:1px solid rgba(255,79,79,0.22);
    color:rgba(255,100,100,0.65); font-family:'DM Mono',monospace;
    font-size:0.65rem; letter-spacing:0.2em; text-transform:uppercase;
    padding:15px; border-radius:12px; cursor:pointer; transition:all 0.25s;
  }
  .profile-signout-btn:hover { background:rgba(255,79,79,0.07); border-color:rgba(255,79,79,0.55); color:#ff7070; }

  .dash-footer-note { text-align:center; font-size:8px; color:rgba(255,215,0,0.2); letter-spacing:0.14em; font-family:'DM Mono',monospace; padding-top:4px; }
  .profile-msg {
    font-family:'DM Mono',monospace; font-size:0.65rem;
    padding:9px 14px; border-radius:10px; margin-bottom:0; display:none; text-align:center; line-height:1.5;
  }
  .profile-msg.success { display:block; color:var(--gold); background:rgba(255,215,0,0.08); border:1px solid rgba(255,215,0,0.25); }
  .profile-msg.error   { display:block; color:#ff6464; background:rgba(255,79,79,0.08); border:1px solid rgba(255,79,79,0.25); }

  /* ===== WALLET PICKER ===== */
  .wallet-picker-overlay {
    position:fixed; inset:0; z-index:9900;
    background:rgba(0,0,0,0.88); backdrop-filter:blur(14px);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity 0.3s;
  }
  .wallet-picker-overlay.active { opacity:1; pointer-events:all; }
  .wallet-picker-box {
    background:var(--card); border:1px solid var(--border);
    border-radius:24px; padding:2rem 1.8rem;
    width:min(400px,92vw); position:relative;
    box-shadow:0 0 60px rgba(255,215,0,0.1), 0 30px 80px rgba(0,0,0,0.6);
    transform:translateY(20px) scale(0.97); opacity:0;
    transition:all 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
  }
  .wallet-picker-overlay.active .wallet-picker-box { transform:translateY(0) scale(1); opacity:1; }
  .wallet-picker-title { font-family:'Bebas Neue',sans-serif; font-size:1.4rem; letter-spacing:4px; color:#fff; margin-bottom:0.4rem; }
  .wallet-picker-sub { font-family:'DM Mono',monospace; font-size:0.62rem; color:var(--text-dim); margin-bottom:1.5rem; letter-spacing:1px; }
  .wallet-picker-close { position:absolute; top:14px; right:16px; background:transparent; border:none; color:var(--text-dim); font-size:1rem; cursor:pointer; transition:color 0.2s; }
  .wallet-picker-close:hover { color:var(--gold); }
  .wallet-options { display:flex; flex-direction:column; gap:10px; }
  .wallet-option {
    display:flex; align-items:center; gap:14px;
    background:var(--black3); border:1px solid var(--border);
    border-radius:14px; padding:14px 16px; cursor:pointer; transition:all 0.25s;
  }
  .wallet-option:hover { border-color:var(--gold); background:var(--gold-faint); transform:translateX(4px); }
  .wallet-option-icon { width:40px; height:40px; border-radius:10px; flex-shrink:0; display:flex; align-items:center; justify-content:center; background:var(--gold-faint); border:1px solid var(--border); font-family:'DM Mono',monospace; font-size:0.6rem; font-weight:500; color:var(--gold); letter-spacing:1px; }
  .wallet-option-info { flex:1; }
  .wallet-option-name { font-family:'DM Mono',monospace; font-size:0.8rem; color:#fff; font-weight:500; margin-bottom:2px; }
  .wallet-option-desc { font-family:'DM Mono',monospace; font-size:0.58rem; color:var(--text-dim); letter-spacing:1px; }
  .wallet-option-arrow { color:var(--text-dim); font-size:1rem; }

  /* ===== HUNT POPUP ===== */
  .hunt-overlay {
    position:fixed; inset:0; z-index:9000;
    background:rgba(0,0,0,0.88); backdrop-filter:blur(16px);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity 0.4s;
  }
  .hunt-overlay.active { opacity:1; pointer-events:all; }
  .hunt-box {
    background:var(--card); border:1px solid var(--border);
    border-radius:28px; padding:3rem 2.5rem;
    width:min(420px,90vw); text-align:center; position:relative;
    box-shadow:0 0 80px rgba(255,215,0,0.12), 0 30px 80px rgba(0,0,0,0.7);
    transform:translateY(40px) scale(0.95); opacity:0;
    transition:transform 0.5s cubic-bezier(0.175,0.885,0.32,1.275), opacity 0.4s;
  }
  .hunt-overlay.active .hunt-box { transform:translateY(0) scale(1); opacity:1; }
  .hunt-box::before {
    content:''; position:absolute; top:0; left:0; right:0; height:3px;
    border-radius:28px 28px 0 0;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .hunt-close { position:absolute; top:16px; right:18px; background:transparent; border:none; color:var(--text-dim); font-size:1.1rem; cursor:pointer; transition:color 0.2s; }
  .hunt-close:hover { color:var(--gold); }
  .hunt-quill-wrap { position:relative; display:inline-block; margin-bottom:1.5rem; }
  .hunt-quill-wrap::before {
    content:''; position:absolute; width:140px; height:140px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,215,0,0.15) 0%, transparent 70%);
    top:50%; left:50%; transform:translate(-50%,-50%);
    animation:pulse 2.5s ease-in-out infinite;
  }
  .hunt-quill { width:90px; height:90px; position:relative; z-index:2; animation:float 3s ease-in-out infinite; }
  .hunt-bubble {
    background:var(--black3); border:1px solid rgba(255,215,0,0.25);
    border-radius:16px; padding:1rem 1.4rem; margin-bottom:1.8rem; position:relative;
  }
  .hunt-bubble::before { content:''; position:absolute; top:-8px; left:50%; transform:translateX(-50%); border-left:8px solid transparent; border-right:8px solid transparent; border-bottom:8px solid rgba(255,215,0,0.25); }
  .hunt-bubble::after  { content:''; position:absolute; top:-6px; left:50%; transform:translateX(-50%); border-left:7px solid transparent; border-right:7px solid transparent; border-bottom:7px solid var(--black3); }
  .hunt-bubble-text { font-family:'DM Mono',monospace; font-size:0.8rem; color:#fff; line-height:1.6; }
  .hunt-bubble-text .gold { color:var(--gold); font-weight:700; }
  .hunt-title { font-family:'Bebas Neue',sans-serif; font-weight:900; font-size:1.6rem; letter-spacing:3px; color:#fff; margin-bottom:0.5rem; }
  .hunt-subtitle { font-family:'DM Mono',monospace; font-size:0.65rem; color:var(--text-dim); letter-spacing:2px; text-transform:uppercase; margin-bottom:1.8rem; }
  .hunt-dismiss {
    background:var(--gold); color:#000; border:none;
    border-radius:50px; padding:12px 32px;
    font-family:'Bebas Neue',sans-serif; font-size:1rem; letter-spacing:3px;
    text-transform:uppercase; cursor:pointer;
    box-shadow:0 0 24px rgba(255,215,0,0.4); transition:all 0.3s;
  }
  .hunt-dismiss:hover { transform:translateY(-2px); box-shadow:0 6px 30px rgba(255,215,0,0.6); }

  /* ===== WC POPUP ===== */
  .wc-overlay {
    position:fixed; inset:0; z-index:9500;
    background:rgba(0,0,0,0.92); backdrop-filter:blur(20px);

    box-shadow:0 0 80px rgba(255,215,0,0.12), 0 30px 80px rgba(0,0,0,0.7);

  .wc-box::before {

    position:absolute; border-radius:50%;

  }

  .wc-ring2 { width:240px; height:240px; animation:rotate 18s linear infinite reverse; border-style:dashed; opacity:0.5; }
  .wc-logo-placeholder {
    width:150px; height:150px; border-radius:22px;

    box-shadow:0 0 40px rgba(255,215,0,0.2);
    display:flex; align-items:center; justify-content:center;
    font-family:'Bebas Neue',sans-serif; font-size:2.5rem; letter-spacing:4px;
    color:rgba(255,215,0,0.4); position:relative; z-index:2;

  .wc-bubble {
    background:var(--black3); border:1px solid rgba(255,215,0,0.2);
    border-radius:14px; padding:0.8rem 1.2rem;
    font-family:'DM Mono',monospace; font-size:0.72rem; color:var(--text-dim);
    line-height:1.6; margin-bottom:1.5rem; position:relative;
  }
  .wc-bubble::before { content:''; position:absolute; top:-8px; left:50%; transform:translateX(-50%); border-left:8px solid transparent; border-right:8px solid transparent; border-bottom:8px solid rgba(255,215,0,0.2); }
  .wc-bubble::after  { content:''; position:absolute; top:-6px; left:50%; transform:translateX(-50%); border-left:7px solid transparent; border-right:7px solid transparent; border-bottom:7px solid var(--black3); }
  .wc-gold { color:var(--gold); font-weight:500; }
  .wc-title { font-family:'Bebas Neue',sans-serif; font-size:1.8rem; letter-spacing:4px; color:#fff; margin-bottom:0.4rem; }
  .wc-title .gold { color:var(--gold); }
  .wc-sub { font-family:'DM Mono',monospace; font-size:0.65rem; color:var(--text-dim); letter-spacing:2px; margin-bottom:1.8rem; }
  .wc-actions { display:flex; flex-direction:column; gap:10px; }
  .wc-btn-connect {
    background:var(--gold); color:#000; border:none;
    border-radius:50px; padding:13px 24px;
    font-family:'Bebas Neue',sans-serif; font-size:1rem; letter-spacing:3px;
    cursor:pointer; transition:all 0.3s;
    box-shadow:0 0 20px rgba(255,215,0,0.3);
  }
  .wc-btn-connect:hover { transform:translateY(-2px); box-shadow:0 6px 30px rgba(255,215,0,0.5); }
  .wc-divider { font-family:'DM Mono',monospace; font-size:0.6rem; color:rgba(255,215,0,0.3); letter-spacing:2px; }
  .wc-btn-email {
    background:transparent; border:1px solid var(--border);
    color:var(--gold); border-radius:50px; padding:12px 24px;
    font-family:'DM Mono',monospace; font-size:0.7rem; letter-spacing:1.5px;
    text-transform:uppercase; cursor:pointer; transition:all 0.3s;
  }

  @media(max-width:640px) {

    .bot-pers-grid { grid-template-columns:1fr; }
    .stats-bar { gap:2rem; }
    .hero-btns { flex-direction:column; }
    .btn-primary, .btn-outline { text-align:center; }
    #home { padding:100px 5% 60px; }
    .contact-links { gap:10px; }

  }

    .creator-dot { display:none; }
  }

  /* ===== WAITLIST REMINDER POPUP ===== */
  .wl-overlay {
    position:fixed; inset:0; z-index:9600;
    background:rgba(0,0,0,0.88); backdrop-filter:blur(16px);
    display:flex; align-items:center; justify-content:center;
    padding:1rem; opacity:0; pointer-events:none; transition:opacity 0.4s;
  }
  .wl-overlay.active { opacity:1; pointer-events:all; }
  .wl-box {
    background:var(--card); border:1px solid var(--border);
    border-radius:28px; padding:2.5rem 2rem;
    width:min(420px,92vw); position:relative; text-align:center;
    box-shadow:0 0 80px rgba(255,215,0,0.12), 0 30px 80px rgba(0,0,0,0.7);
    transform:translateY(30px) scale(0.97); opacity:0;
    transition:all 0.5s cubic-bezier(0.175,0.885,0.32,1.275);
  }
  .wl-overlay.active .wl-box { transform:translateY(0) scale(1); opacity:1; }
  .wl-box::before {
    content:''; position:absolute; top:0; left:0; right:0; height:3px;
    border-radius:28px 28px 0 0;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
    box-shadow:0 0 16px rgba(255,215,0,0.4);
  }
  .wl-close {
    position:absolute; top:14px; right:16px;
    background:transparent; border:none; color:var(--text-dim);
    font-size:1rem; cursor:pointer; transition:color 0.2s; line-height:1;
  }
  .wl-close:hover { color:var(--gold); }
  .wl-icon {
    font-family:'Bebas Neue',sans-serif; font-size:2.8rem; letter-spacing:4px;
    color:var(--gold); text-shadow:0 0 30px rgba(255,215,0,0.5);
    margin-bottom:0.8rem;
  }
  .wl-title {
    font-family:'Bebas Neue',sans-serif; font-size:1.8rem;
    letter-spacing:3px; color:#fff; margin-bottom:0.5rem;
  }
  .wl-title .gold { color:var(--gold); }
  .wl-sub {
    font-family:'DM Mono',monospace; font-size:0.68rem;
    color:var(--text-dim); letter-spacing:1px; line-height:1.7;
    margin-bottom:1.8rem;
  }
  .wl-form { display:flex; flex-direction:column; gap:10px; }
  .wl-input {
    width:100%; background:var(--black3); border:1px solid var(--border);
    border-radius:50px; padding:13px 20px; color:#fff;
    font-family:'DM Mono',monospace; font-size:0.8rem;
    outline:none; transition:border-color 0.3s, box-shadow 0.3s;
    box-sizing:border-box; text-align:center;
  }
  .wl-input:focus { border-color:var(--gold); box-shadow:0 0 16px rgba(255,215,0,0.15); }
  .wl-input::placeholder { color:var(--text-dim); }
  .wl-btn {
    width:100%; background:var(--gold); color:#000; border:none;
    border-radius:50px; padding:13px;
    font-family:'Bebas Neue',sans-serif; font-size:1rem;
    letter-spacing:3px; text-transform:uppercase; cursor:pointer;
    box-shadow:0 0 24px rgba(255,215,0,0.35); transition:all 0.3s;
  }
  .wl-btn:hover { transform:translateY(-2px); box-shadow:0 6px 30px rgba(255,215,0,0.5); }
  .wl-btn:disabled { opacity:0.6; cursor:not-allowed; transform:none; }
  .wl-msg {
    margin-top:0.8rem; font-family:'DM Mono',monospace; font-size:0.68rem;
    padding:9px 14px; border-radius:50px; display:none; line-height:1.5;
  }
  .wl-msg.success { display:block; color:var(--gold); background:rgba(255,215,0,0.08); border:1px solid rgba(255,215,0,0.25); }
  .wl-msg.error   { display:block; color:#ff6464; background:rgba(255,79,79,0.08); border:1px solid rgba(255,79,79,0.2); }
  .wl-later {
    display:block; margin-top:1rem;
    background:transparent; border:none; color:rgba(255,215,0,0.35);
    font-family:'DM Mono',monospace; font-size:0.62rem;
    cursor:pointer; letter-spacing:1px; transition:color 0.2s;
  }
  .wl-later:hover { color:var(--gold); }
</style>
